[project]
name = "tgbotstory2"
version = "0.1.0"
description = "Telegram bot for monitoring VK stories"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=20.0",
    "apscheduler>=3.10",
    "aiosqlite>=0.19",
    "aiohttp>=3.9",
    "structlog>=24.0",
    "selenium>=4.15",
    "webdriver-manager>=4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot"]