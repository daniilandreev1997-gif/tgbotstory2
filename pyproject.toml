[project]
name = "tgbotstory2"
version = "0.1.0"
description = "Telegram bot for VK/Instagram/TikTok content monitoring"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7,<4.0",
    "vkbottle>=4.3,<5.0",
    "instagrapi>=2.1,<3.0",
    "TikTokApi>=6.2,<7.0",
    "playwright>=1.44,<2.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    "apscheduler>=3.10,<4.0",
    "pydantic-settings>=2.2,<3.0",
    "structlog>=23.2,<27.0",
    "cryptography>=41.0,<44.0",
    "httpx>=0.27,<1.0",
    "aiohttp>=3.9,<4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
